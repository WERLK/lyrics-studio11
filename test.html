<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>测试页面</title>
  <style>
    body {
      background: #0d0d1a;
      color: white;
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      font-size: 3rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      color: rgba(192, 132, 252, 0.7);
      margin-bottom: 2rem;
    }
    .btn {
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🎵</div>
    <h1>歌词工坊</h1>
    <p>智能歌词生成与管理工具</p>
    <button class="btn" onclick="testFunction()">测试按钮</button>
  </div>

  <script>
    function testFunction() {
      alert('JavaScript 正常工作！');
    }
    
    console.log('测试页面加载成功');
    console.log('文档状态:', document.readyState);
  </script>
</body>
</html>
